<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Compensi Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @media print {
      .no-print { display: none !important; }
      .print-break { page-break-before: always; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    .tab-active { position: relative; }
    .tab-active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
    }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Custom range slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 9999px;
      background: #e5e7eb;
    }
    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 9999px;
      background: #e5e7eb;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin-top: -10px;
      cursor: grab;
    }
    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: grab;
    }
    input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.15); }
    input[type="range"]:active::-moz-range-thumb { cursor: grabbing; transform: scale(1.15); }
    input[type="range"].slider-blue::-webkit-slider-thumb { background: #3b82f6; }
    input[type="range"].slider-blue::-moz-range-thumb { background: #3b82f6; }
    input[type="range"].slider-green::-webkit-slider-thumb { background: #22c55e; }
    input[type="range"].slider-green::-moz-range-thumb { background: #22c55e; }
    input[type="range"].slider-yellow::-webkit-slider-thumb { background: #f59e0b; }
    input[type="range"].slider-yellow::-moz-range-thumb { background: #f59e0b; }

    /* Touch-friendly sizing on mobile */
    @media (max-width: 640px) {
      input[type="range"]::-webkit-slider-thumb { width: 32px; height: 32px; margin-top: -12px; }
      input[type="range"]::-moz-range-thumb { width: 32px; height: 32px; }
    }

    /* Safe area for mobile bottom nav */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
    @media (max-width: 640px) {
      .mobile-bottom-pad { padding-bottom: 90px; }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            federica: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af' },
            simona: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534' },
            asmaa: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // ─── Defaults ───
    const DEFAULT_SETTINGS = {
      fissoFederica: 1000,
      fissoSimona: 500,
      fissoAsmaa: 500,
      compensoPerApp: 10,
      teamBonusPercent: 50,
      rimborsoSIM: 10,
      soglie: [
        { min: 50, bonus: 100 },
        { min: 60, bonus: 100 },
        { min: 80, bonus: 200 },
        { min: 100, bonus: 400 },
      ],
      rinnoviAttivi: false,
      rinnovoAnnualePerc: 2,
      rinnovoQuadPerc: 3,
    };

    const DEFAULT_MONTH_DATA = {
      federica: { appuntamenti: 0, sim: true, rinnovoAnnuale: 0, rinnovoQuad: 0 },
      simona: { appuntamenti: 0, sim: true, rinnovoAnnuale: 0, rinnovoQuad: 0 },
      asmaa: { appuntamenti: 0, sim: true, rinnovoAnnuale: 0, rinnovoQuad: 0 },
    };

    const PEOPLE = {
      federica: { nome: 'Federica', ruolo: 'Direttrice di segreteria', color: 'federica', initials: 'F' },
      simona: { nome: 'Simona', ruolo: 'Segretaria', color: 'simona', initials: 'S' },
      asmaa: { nome: 'Asmaa', ruolo: 'Segretaria', color: 'asmaa', initials: 'A' },
    };

    // ─── Helpers ───
    const fmt = (n) => n.toLocaleString('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' €';

    function calcBonusAppuntamenti(appuntamenti, soglie) {
      let bonus = 0;
      const raggiunte = [];
      for (const s of soglie) {
        if (appuntamenti >= s.min) {
          bonus += s.bonus;
          raggiunte.push(s);
        }
      }
      return { bonus, raggiunte };
    }

    function calcCompenso(key, data, settings) {
      const person = data[key];
      const app = person.appuntamenti;
      const isFederica = key === 'federica';
      const fisso = settings[`fisso${key.charAt(0).toUpperCase() + key.slice(1)}`];
      const compensoApp = app * settings.compensoPerApp;
      const { bonus: bonusApp, raggiunte } = calcBonusAppuntamenti(app, settings.soglie);

      const voci = [
        { label: 'Fisso mensile', value: fisso },
        { label: `Appuntamenti (${app} × ${fmt(settings.compensoPerApp)})`, value: compensoApp },
        { label: `Bonus soglie (${app} presentati)`, value: bonusApp },
      ];

      if (isFederica) {
        // Bonus team
        const bonusAsmaa = calcBonusAppuntamenti(data.asmaa.appuntamenti, settings.soglie).bonus;
        const bonusSimona = calcBonusAppuntamenti(data.simona.appuntamenti, settings.soglie).bonus;
        const teamAsmaa = Math.round(bonusAsmaa * settings.teamBonusPercent / 100);
        const teamSimona = Math.round(bonusSimona * settings.teamBonusPercent / 100);
        voci.push({ label: `Bonus team da Asmaa (${settings.teamBonusPercent}% di ${fmt(bonusAsmaa)})`, value: teamAsmaa });
        voci.push({ label: `Bonus team da Simona (${settings.teamBonusPercent}% di ${fmt(bonusSimona)})`, value: teamSimona });
      }

      if (person.sim) {
        voci.push({ label: 'Rimborso SIM', value: settings.rimborsoSIM });
      }

      // Rinnovi (placeholder)
      if (settings.rinnoviAttivi) {
        const rinnAnn = person.rinnovoAnnuale * settings.rinnovoAnnualePerc / 100;
        const rinnQuad = person.rinnovoQuad * settings.rinnovoQuadPerc / 100;
        if (rinnAnn > 0) voci.push({ label: `Rinnovo annuale (${settings.rinnovoAnnualePerc}% di ${fmt(person.rinnovoAnnuale)})`, value: rinnAnn });
        if (rinnQuad > 0) voci.push({ label: `Rinnovo quadrimestrale (${settings.rinnovoQuadPerc}% di ${fmt(person.rinnovoQuad)})`, value: rinnQuad });
      }

      const totale = voci.reduce((s, v) => s + v.value, 0);
      return { voci, totale, raggiunte, bonusApp };
    }

    // ─── Components ───

    function Avatar({ person, size = 'md' }) {
      const sizes = { sm: 'w-8 h-8 text-sm', md: 'w-12 h-12 text-lg', lg: 'w-16 h-16 text-2xl' };
      return (
        <div className={`${sizes[size]} rounded-full bg-${person.color}-500 text-white font-bold flex items-center justify-center shadow-lg`}>
          {person.initials}
        </div>
      );
    }

    function Toggle({ checked, onChange, label, color = 'blue' }) {
      return (
        <label className="flex items-center gap-3 cursor-pointer select-none">
          <div className="relative" onClick={() => onChange(!checked)}>
            <div className={`w-12 h-6 rounded-full transition-colors duration-200 ${checked ? `bg-${color}-500` : 'bg-gray-300'}`}></div>
            <div className={`absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 ${checked ? 'translate-x-6' : ''}`}></div>
          </div>
          <span className="text-sm text-gray-700 font-bold">{label}</span>
        </label>
      );
    }

    function BonusMeter({ appuntamenti, soglie, color }) {
      return (
        <div className="space-y-2">
          <h4 className="text-sm font-semibold text-gray-600 uppercase tracking-wide">Fasce bonus raggiunte</h4>
          <div className="grid grid-cols-2 gap-2">
            {soglie.map((s, i) => {
              const reached = appuntamenti >= s.min;
              return (
                <div
                  key={i}
                  className={`rounded-xl p-3 text-center transition-all duration-300 border-2 ${
                    reached
                      ? `bg-${color}-50 border-${color}-400 shadow-md scale-105`
                      : 'bg-gray-50 border-gray-200 opacity-60'
                  }`}
                >
                  <div className={`text-xs font-medium ${reached ? `text-${color}-600` : 'text-gray-400'}`}>
                    {reached ? '✓' : ''} ≥ {s.min} app.
                  </div>
                  <div className={`text-lg font-bold ${reached ? `text-${color}-700` : 'text-gray-400'}`}>
                    +{fmt(s.bonus)}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function PersonCard({ personKey, data, setData, settings }) {
      const person = PEOPLE[personKey];
      const pData = data[personKey];
      const comp = calcCompenso(personKey, data, settings);

      const update = (field, value) => {
        setData(prev => ({ ...prev, [personKey]: { ...prev[personKey], [field]: value } }));
      };

      return (
        <div className="fade-in space-y-6">
          {/* Header */}
          <div className={`bg-gradient-to-r from-${person.color}-500 to-${person.color}-600 rounded-2xl p-5 sm:p-6 text-white shadow-xl`}>
            <div className="flex items-center gap-3 sm:gap-4">
              <div className={`w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-xl sm:text-2xl font-bold shrink-0`}>
                {person.initials}
              </div>
              <div className="min-w-0">
                <h2 className="text-xl sm:text-2xl font-bold">{person.nome}</h2>
                <p className="text-white/80 text-sm">{person.ruolo}</p>
              </div>
              <div className="ml-auto text-right shrink-0">
                <p className="text-white/70 text-xs sm:text-sm">Totale</p>
                <p className="text-2xl sm:text-3xl font-extrabold">{fmt(comp.totale)}</p>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Input Section */}
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-6">
              <h3 className="text-lg font-bold text-gray-800">Dati del mese</h3>

              {/* Appuntamenti */}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="block text-sm font-bold text-gray-600">
                    Appuntamenti presentati
                  </label>
                  <span className={`text-sm font-bold text-${person.color}-600`}>
                    {fmt(pData.appuntamenti * settings.compensoPerApp)}
                  </span>
                </div>
                <div className="flex items-center gap-4">
                  <div className="flex-1 relative py-2">
                    <input
                      type="range"
                      min="0"
                      max="150"
                      value={pData.appuntamenti}
                      onChange={e => update('appuntamenti', parseInt(e.target.value))}
                      className={`w-full slider-${person.color === 'federica' ? 'blue' : person.color === 'simona' ? 'green' : 'yellow'}`}
                    />
                    <div className="flex justify-between text-xs text-gray-400 mt-1 px-0.5">
                      <span>0</span>
                      <span>50</span>
                      <span>100</span>
                      <span>150</span>
                    </div>
                  </div>
                  <input
                    type="text"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    value={pData.appuntamenti}
                    onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                    onChange={e => { const v = e.target.value.replace(/[^0-9]/g, ''); update('appuntamenti', v === '' ? 0 : parseInt(v, 10)); }}
                    className={`w-20 text-center text-lg font-bold border-2 border-${person.color}-300 rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-${person.color}-400`}
                  />
                </div>
              </div>

              {/* SIM toggle */}
              <Toggle
                checked={pData.sim}
                onChange={v => update('sim', v)}
                label="SIM aziendale attiva"
                color={person.color}
              />

              {/* Rinnovi placeholder */}
              <div className={`rounded-xl p-4 ${settings.rinnoviAttivi ? 'bg-gray-50' : 'bg-gray-50 opacity-60'}`}>
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-sm font-semibold text-gray-600">
                    {settings.rinnoviAttivi ? 'Bonus rinnovi' : 'Bonus rinnovi — prossimamente'}
                  </span>
                  {!settings.rinnoviAttivi && (
                    <span className="text-xs bg-gray-200 text-gray-500 px-2 py-0.5 rounded-full">Disabilitato</span>
                  )}
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs text-gray-500 mb-1">Rinnovo annuale (€)</label>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={pData.rinnovoAnnuale}
                      onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                      onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update('rinnovoAnnuale', v === '' ? 0 : parseFloat(v) || 0); }}
                      disabled={!settings.rinnoviAttivi}
                      className="w-full border rounded-lg p-2 text-sm disabled:bg-gray-100 disabled:text-gray-400"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-gray-500 mb-1">Rinnovo quadrimestrale (€)</label>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={pData.rinnovoQuad}
                      onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                      onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update('rinnovoQuad', v === '' ? 0 : parseFloat(v) || 0); }}
                      disabled={!settings.rinnoviAttivi}
                      className="w-full border rounded-lg p-2 text-sm disabled:bg-gray-100 disabled:text-gray-400"
                    />
                  </div>
                </div>
              </div>
            </div>

            {/* Breakdown Section */}
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-6">
              <h3 className="text-lg font-bold text-gray-800">Dettaglio compenso</h3>

              <BonusMeter appuntamenti={pData.appuntamenti} soglie={settings.soglie} color={person.color} />

              <div className="space-y-2 mt-4">
                {comp.voci.map((v, i) => (
                  <div key={i} className={`flex justify-between items-center py-2 px-3 rounded-lg ${v.value > 0 ? 'bg-gray-50' : ''}`}>
                    <span className="text-sm font-medium text-gray-600">{v.label}</span>
                    <span className={`font-bold ${v.value > 0 ? `text-${person.color}-700` : 'text-gray-400'}`}>
                      {v.value > 0 ? '+' : ''}{fmt(v.value)}
                    </span>
                  </div>
                ))}
                <div className={`flex justify-between items-center py-3 px-3 rounded-xl bg-${person.color}-50 border-2 border-${person.color}-200 mt-3`}>
                  <span className="text-base font-bold text-gray-800">Totale</span>
                  <span className={`text-xl font-extrabold text-${person.color}-700`}>{fmt(comp.totale)}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TeamSummary({ data, settings }) {
      const comps = {
        federica: calcCompenso('federica', data, settings),
        asmaa: calcCompenso('asmaa', data, settings),
        simona: calcCompenso('simona', data, settings),
      };
      const costoTotale = comps.federica.totale + comps.simona.totale + comps.asmaa.totale;
      const maxTotale = Math.max(comps.federica.totale, comps.simona.totale, comps.asmaa.totale, 1);

      const mesi = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
      const [anno, meseNum] = data.mese.split('-');
      const meseLabel = `${mesi[parseInt(meseNum) - 1]} ${anno}`;

      return (
        <div className="fade-in space-y-6">
          <div className="bg-gradient-to-r from-gray-800 to-gray-900 rounded-2xl p-5 sm:p-6 text-white shadow-xl">
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h2 className="text-xl sm:text-2xl font-bold">Riepilogo Team</h2>
                <p className="text-gray-400 text-sm">{meseLabel}</p>
              </div>
              <div className="text-right">
                <p className="text-gray-400 text-xs sm:text-sm">Costo totale team</p>
                <p className="text-2xl sm:text-3xl font-extrabold">{fmt(costoTotale)}</p>
              </div>
            </div>
          </div>

          {/* Bar Chart */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h3 className="text-lg font-bold text-gray-800 mb-6">Confronto compensi</h3>
            <div className="space-y-4">
              {Object.entries(comps).map(([key, comp]) => {
                const person = PEOPLE[key];
                const pct = (comp.totale / maxTotale) * 100;
                const colors = {
                  federica: { bg: 'bg-federica-500', text: 'text-federica-700' },
                  simona: { bg: 'bg-simona-500', text: 'text-simona-700' },
                  asmaa: { bg: 'bg-asmaa-500', text: 'text-asmaa-700' },
                };
                return (
                  <div key={key} className="flex items-center gap-4">
                    <div className="w-20 sm:w-24 flex items-center gap-2 shrink-0">
                      <Avatar person={person} size="sm" />
                      <span className="text-xs sm:text-sm font-bold text-gray-700">{person.nome}</span>
                    </div>
                    <div className="flex-1 bg-gray-100 rounded-full h-8 overflow-hidden">
                      <div
                        className={`h-full ${colors[key].bg} rounded-full transition-all duration-700 ease-out flex items-center justify-end pr-3`}
                        style={{ width: `${Math.max(pct, 5)}%` }}
                      >
                        <span className="text-white text-sm font-bold whitespace-nowrap">{fmt(comp.totale)}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Detail Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            {Object.entries(comps).map(([key, comp]) => {
              const person = PEOPLE[key];
              return (
                <div key={key} className={`bg-white rounded-2xl p-5 shadow-sm border-2 border-${person.color}-200`}>
                  <div className="flex items-center gap-3 mb-4">
                    <Avatar person={person} size="sm" />
                    <div>
                      <p className="font-bold text-gray-800">{person.nome}</p>
                      <p className="text-xs text-gray-500">{person.ruolo}</p>
                    </div>
                  </div>
                  <div className="space-y-1.5">
                    {comp.voci.map((v, i) => (
                      <div key={i} className="flex justify-between text-sm">
                        <span className="text-gray-500 font-medium truncate mr-2">{v.label.split('(')[0].trim()}</span>
                        <span className={`font-bold ${v.value > 0 ? `text-${person.color}-600` : 'text-gray-400'} shrink-0`}>
                          {fmt(v.value)}
                        </span>
                      </div>
                    ))}
                    <div className={`flex justify-between pt-2 mt-2 border-t-2 border-${person.color}-200`}>
                      <span className="font-bold text-gray-800">Totale</span>
                      <span className={`font-extrabold text-${person.color}-700`}>{fmt(comp.totale)}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SettingsPanel({ settings, setSettings }) {
      const update = (field, value) => {
        setSettings(prev => ({ ...prev, [field]: value }));
      };

      const updateSoglia = (index, field, value) => {
        setSettings(prev => {
          const soglie = [...prev.soglie];
          soglie[index] = { ...soglie[index], [field]: value };
          return { ...prev, soglie };
        });
      };

      const resetDefaults = () => {
        if (confirm('Ripristinare tutte le impostazioni ai valori predefiniti?')) {
          setSettings(DEFAULT_SETTINGS);
        }
      };

      return (
        <div className="fade-in space-y-6">
          <div className="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-2xl p-6 text-white shadow-xl">
            <h2 className="text-2xl font-bold">Impostazioni</h2>
            <p className="text-white/70">Configura i parametri di calcolo</p>
          </div>

          {/* Fissi mensili */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h3 className="text-lg font-bold text-gray-800 mb-4">Compensi fissi mensili</h3>
            <div className="grid sm:grid-cols-3 gap-4">
              {[
                { key: 'fissoFederica', label: 'Federica', color: 'federica' },
                { key: 'fissoAsmaa', label: 'Asmaa', color: 'asmaa' },
                { key: 'fissoSimona', label: 'Simona', color: 'simona' },
              ].map(item => (
                <div key={item.key}>
                  <label className="block text-sm font-medium text-gray-600 mb-1">{item.label}</label>
                  <div className="relative">
                    <input
                      type="text"
                      inputMode="numeric"
                      value={settings[item.key]}
                      onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                      onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update(item.key, v === '' ? 0 : parseFloat(v) || 0); }}
                      className={`w-full border-2 border-${item.color}-300 rounded-xl p-3 pr-8 text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-${item.color}-400`}
                    />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">€</span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Parametri generali */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h3 className="text-lg font-bold text-gray-800 mb-4">Parametri generali</h3>
            <div className="grid sm:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">€ per appuntamento</label>
                <input
                  type="text"
                  inputMode="numeric"
                  value={settings.compensoPerApp}
                  onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                  onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update('compensoPerApp', v === '' ? 0 : parseFloat(v) || 0); }}
                  className="w-full border-2 border-gray-300 rounded-xl p-3 text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-gray-400"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">Bonus team (%)</label>
                <input
                  type="text"
                  inputMode="numeric"
                  value={settings.teamBonusPercent}
                  onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                  onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update('teamBonusPercent', v === '' ? 0 : Math.min(100, parseFloat(v) || 0)); }}
                  className="w-full border-2 border-gray-300 rounded-xl p-3 text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-gray-400"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">Rimborso SIM (€)</label>
                <input
                  type="text"
                  inputMode="numeric"
                  value={settings.rimborsoSIM}
                  onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                  onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update('rimborsoSIM', v === '' ? 0 : parseFloat(v) || 0); }}
                  className="w-full border-2 border-gray-300 rounded-xl p-3 text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-gray-400"
                />
              </div>
            </div>
          </div>

          {/* Soglie bonus */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h3 className="text-lg font-bold text-gray-800 mb-4">Soglie bonus appuntamenti</h3>
            <div className="space-y-3">
              <div className="grid grid-cols-2 gap-4 text-xs font-semibold text-gray-500 uppercase tracking-wide px-1">
                <span>Appuntamenti minimi</span>
                <span>Bonus fascia (€)</span>
              </div>
              {settings.soglie.map((s, i) => (
                <div key={i} className="grid grid-cols-2 gap-4">
                  <input
                    type="text"
                    inputMode="numeric"
                    value={s.min}
                    onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                    onChange={e => { const v = e.target.value.replace(/[^0-9]/g, ''); updateSoglia(i, 'min', v === '' ? 0 : parseInt(v, 10)); }}
                    className="border-2 border-gray-300 rounded-xl p-3 text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-gray-400"
                  />
                  <input
                    type="text"
                    inputMode="numeric"
                    value={s.bonus}
                    onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                    onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); updateSoglia(i, 'bonus', v === '' ? 0 : parseFloat(v) || 0); }}
                    className="border-2 border-gray-300 rounded-xl p-3 text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-gray-400"
                  />
                </div>
              ))}
            </div>
          </div>

          {/* Rinnovi */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold text-gray-800">Bonus rinnovi</h3>
              <Toggle
                checked={settings.rinnoviAttivi}
                onChange={v => update('rinnoviAttivi', v)}
                label={settings.rinnoviAttivi ? 'Attivo' : 'Disattivato'}
                color="purple"
              />
            </div>
            <div className={`grid sm:grid-cols-2 gap-4 ${!settings.rinnoviAttivi ? 'opacity-50 pointer-events-none' : ''}`}>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">% Rinnovo annuale</label>
                <input
                  type="text"
                  inputMode="decimal"
                  value={settings.rinnovoAnnualePerc}
                  onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                  onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update('rinnovoAnnualePerc', v === '' ? 0 : Math.min(100, parseFloat(v) || 0)); }}
                  className="w-full border-2 border-gray-300 rounded-xl p-3 text-lg font-semibold"
                />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-600 mb-1">% Rinnovo quadrimestrale</label>
                <input
                  type="text"
                  inputMode="decimal"
                  value={settings.rinnovoQuadPerc}
                  onFocus={e => { if (e.target.value === '0') e.target.select(); }}
                  onChange={e => { const v = e.target.value.replace(/[^0-9.]/g, ''); update('rinnovoQuadPerc', v === '' ? 0 : Math.min(100, parseFloat(v) || 0)); }}
                  className="w-full border-2 border-gray-300 rounded-xl p-3 text-lg font-semibold"
                />
              </div>
            </div>
          </div>

          <button
            onClick={resetDefaults}
            className="text-sm text-gray-500 hover:text-red-500 transition-colors underline"
          >
            Ripristina valori predefiniti
          </button>
        </div>
      );
    }

    // ─── Month Picker ───
    function MonthPicker({ data, setData }) {
      const mesi = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
      const mesiLong = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
      const [anno, meseNum] = data.mese.split('-');
      const meseIdx = parseInt(meseNum) - 1;
      const [open, setOpen] = useState(false);
      const [pickerAnno, setPickerAnno] = useState(parseInt(anno));
      const pickerRef = React.useRef(null);

      // Close picker on outside click
      useEffect(() => {
        if (!open) return;
        const handler = (e) => {
          if (pickerRef.current && !pickerRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener('mousedown', handler);
        document.addEventListener('touchstart', handler);
        return () => { document.removeEventListener('mousedown', handler); document.removeEventListener('touchstart', handler); };
      }, [open]);

      const changeMonth = (delta) => {
        let newIdx = meseIdx + delta;
        let newAnno = parseInt(anno);
        if (newIdx < 0) { newIdx = 11; newAnno--; }
        if (newIdx > 11) { newIdx = 0; newAnno++; }
        setData(prev => ({ ...prev, mese: `${newAnno}-${String(newIdx + 1).padStart(2, '0')}` }));
      };

      const selectMonth = (mIdx) => {
        setData(prev => ({ ...prev, mese: `${pickerAnno}-${String(mIdx + 1).padStart(2, '0')}` }));
        setOpen(false);
      };

      const toggleOpen = () => {
        setPickerAnno(parseInt(anno));
        setOpen(prev => !prev);
      };

      return (
        <div className="relative" ref={pickerRef}>
          <div className="flex items-center gap-1 bg-gray-100 rounded-xl p-1">
            <button
              onClick={() => changeMonth(-1)}
              className="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-white hover:shadow transition-all text-gray-600"
            >
              <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <button
              onClick={toggleOpen}
              className="px-3 py-1.5 text-sm font-semibold text-gray-800 min-w-[100px] text-center select-none rounded-lg hover:bg-white hover:shadow transition-all"
            >
              <span className="hidden sm:inline">{mesiLong[meseIdx]}</span>
              <span className="sm:hidden">{mesi[meseIdx]}</span>
              {' '}{anno}
            </button>
            <button
              onClick={() => changeMonth(1)}
              className="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-white hover:shadow transition-all text-gray-600"
            >
              <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>

          {/* Dropdown month/year picker */}
          {open && (
            <div className="absolute right-0 top-full mt-2 bg-white rounded-2xl shadow-xl border border-gray-200 p-4 z-[100] w-[280px] fade-in">
              {/* Year navigation */}
              <div className="flex items-center justify-between mb-3">
                <button
                  onClick={() => setPickerAnno(prev => prev - 1)}
                  className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-600 transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <span className="text-base font-bold text-gray-800">{pickerAnno}</span>
                <button
                  onClick={() => setPickerAnno(prev => prev + 1)}
                  className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-600 transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              </div>
              {/* Month grid */}
              <div className="grid grid-cols-3 gap-1.5">
                {mesi.map((m, i) => {
                  const isSelected = i === meseIdx && pickerAnno === parseInt(anno);
                  return (
                    <button
                      key={i}
                      onClick={() => selectMonth(i)}
                      className={`py-2 px-1 rounded-xl text-sm font-medium transition-all ${
                        isSelected
                          ? 'bg-blue-600 text-white shadow-md'
                          : 'text-gray-700 hover:bg-gray-100'
                      }`}
                    >
                      {m}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Main App ───
    function App() {
      const [tab, setTab] = useState('federica');
      const [mese, setMese] = useState(() => new Date().toISOString().slice(0, 7));

      // All months data: { "2026-04": { federica: {...}, asmaa: {...}, simona: {...} }, ... }
      const [allData, setAllData] = useState(() => {
        try {
          const saved = localStorage.getItem('compensi-alldata');
          if (saved) return JSON.parse(saved);
          // Migrate from old single-month format
          const oldSaved = localStorage.getItem('compensi-data');
          if (oldSaved) {
            const old = JSON.parse(oldSaved);
            const oldMese = old.mese || new Date().toISOString().slice(0, 7);
            const { mese: _, ...monthData } = old;
            return { [oldMese]: { ...DEFAULT_MONTH_DATA, ...monthData } };
          }
          return {};
        } catch { return {}; }
      });

      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('compensi-settings');
          return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
        } catch { return DEFAULT_SETTINGS; }
      });

      // Current month data (with defaults for empty months)
      const data = useMemo(() => {
        const monthData = allData[mese] || DEFAULT_MONTH_DATA;
        return {
          ...{ mese },
          federica: { ...DEFAULT_MONTH_DATA.federica, ...monthData.federica },
          asmaa: { ...DEFAULT_MONTH_DATA.asmaa, ...monthData.asmaa },
          simona: { ...DEFAULT_MONTH_DATA.simona, ...monthData.simona },
        };
      }, [allData, mese]);

      // setData updates allData for the current month
      const setData = useCallback((updater) => {
        setAllData(prev => {
          const currentMonth = prev[mese] || DEFAULT_MONTH_DATA;
          const fullCurrent = {
            mese,
            federica: { ...DEFAULT_MONTH_DATA.federica, ...currentMonth.federica },
            asmaa: { ...DEFAULT_MONTH_DATA.asmaa, ...currentMonth.asmaa },
            simona: { ...DEFAULT_MONTH_DATA.simona, ...currentMonth.simona },
          };
          const updated = typeof updater === 'function' ? updater(fullCurrent) : updater;
          const { mese: newMese, ...monthOnly } = updated;
          if (newMese && newMese !== mese) {
            setMese(newMese);
            return prev;
          }
          return { ...prev, [mese]: monthOnly };
        });
      }, [mese]);

      // Month change handler for MonthPicker
      const setMeseFromPicker = useCallback((updater) => {
        if (typeof updater === 'function') {
          const result = updater(data);
          if (result.mese !== mese) {
            setMese(result.mese);
          }
        }
      }, [data, mese]);

      useEffect(() => {
        localStorage.setItem('compensi-alldata', JSON.stringify(allData));
      }, [allData]);

      useEffect(() => {
        localStorage.setItem('compensi-settings', JSON.stringify(settings));
      }, [settings]);

      const tabs = [
        { id: 'federica', label: 'Federica', color: 'federica', icon: 'F' },
        { id: 'asmaa', label: 'Asmaa', color: 'asmaa', icon: 'A' },
        { id: 'simona', label: 'Simona', color: 'simona', icon: 'S' },
        { id: 'riepilogo', label: 'Riepilogo', color: 'gray', icon: '=' },
        { id: 'impostazioni', label: 'Impostazioni', color: 'purple', icon: '*' },
      ];

      const iconColors = {
        federica: 'bg-federica-500',
        simona: 'bg-simona-500',
        asmaa: 'bg-asmaa-500',
        gray: 'bg-gray-700',
        purple: 'bg-purple-600',
      };

      return (
        <div className="min-h-screen bg-gray-50 mobile-bottom-pad">
          {/* Top bar */}
          <header className="bg-white border-b border-gray-200 sticky top-0 z-50 no-print">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold shadow" style={{ background: 'linear-gradient(135deg, #6b7a2f, #8a9a3e)' }}>
                  C
                </div>
                <div>
                  <h1 className="text-lg font-bold text-gray-900 leading-tight">Compensi Delivery</h1>
                </div>
              </div>
              <MonthPicker data={data} setData={setMeseFromPicker} />
            </div>
          </header>

          {/* Tab nav - top on desktop, bottom on mobile */}
          <nav className="bg-white border-b border-gray-100 sticky top-[57px] z-40 no-print hidden sm:block">
            <div className="max-w-5xl mx-auto px-4">
              <div className="flex gap-1 overflow-x-auto py-2 -mb-px justify-center">
                {tabs.map(t => (
                  <button
                    key={t.id}
                    onClick={() => setTab(t.id)}
                    className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${
                      tab === t.id
                        ? `bg-${t.color}-50 text-${t.color}-700 shadow-sm`
                        : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'
                    }`}
                  >
                    <span className={`w-6 h-6 rounded-full ${tab === t.id ? iconColors[t.color] : 'bg-gray-300'} text-white text-xs flex items-center justify-center font-bold transition-colors`}>
                      {t.icon}
                    </span>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>
          </nav>

          {/* Bottom tab bar for mobile */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 z-50 no-print safe-bottom px-3 pb-2">
            <div className="rounded-2xl shadow-lg px-2 py-2 flex justify-around items-center" style={{ backgroundColor: '#3d4a1a', boxShadow: '0 -2px 20px rgba(61,74,26,0.3)' }}>
              {tabs.map(t => {
                const active = tab === t.id;
                const navIcons = {
                  federica: <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
                  asmaa: <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
                  simona: <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
                  riepilogo: <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
                  impostazioni: <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
                };
                return (
                  <button
                    key={t.id}
                    onClick={() => setTab(t.id)}
                    className={`flex flex-col items-center gap-1 py-1.5 px-3 rounded-xl transition-all duration-200 ${
                      active ? 'scale-105' : ''
                    }`}
                    style={active ? { backgroundColor: 'rgba(255,255,255,0.15)' } : {}}
                  >
                    <div className={`transition-all duration-200 ${active ? 'text-white' : 'text-white/40'}`}>
                      {navIcons[t.id]}
                    </div>
                    <span className={`text-[10px] font-bold transition-all duration-200 ${active ? 'text-white' : 'text-white/40'}`}>
                      {t.label === 'Impostazioni' ? 'Impost.' : t.label}
                    </span>
                    {active && <div className="w-4 h-1 rounded-full bg-white/60 mt-0.5"></div>}
                  </button>
                );
              })}
            </div>
          </nav>

          {/* Content */}
          <main className="max-w-5xl mx-auto px-4 py-6">
            {tab === 'federica' && <PersonCard personKey="federica" data={data} setData={setData} settings={settings} />}
            {tab === 'asmaa' && <PersonCard personKey="asmaa" data={data} setData={setData} settings={settings} />}
            {tab === 'simona' && <PersonCard personKey="simona" data={data} setData={setData} settings={settings} />}
            {tab === 'riepilogo' && <TeamSummary data={data} settings={settings} />}
            {tab === 'impostazioni' && <SettingsPanel settings={settings} setSettings={setSettings} />}
          </main>

          {/* Footer */}
          <footer className="text-center py-6 text-xs text-gray-400 no-print">
            Compensi Delivery &middot; Dati salvati automaticamente nel browser
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
